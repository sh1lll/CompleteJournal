name: Desktop apps

# Builds the double-click app for Windows, macOS and Linux, launches each one
# headlessly to prove it starts and serves its UI, and attaches the builds to
# a GitHub Release when a version tag (v*) is pushed.

on:
  push:
    tags: ["v*"]
    # build + smoke-test on every push to main and to working branches
    # (releases are still published only from v* tags)
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: CompleteJournal-windows
          - os: macos-latest
            artifact: CompleteJournal-macos
          - os: ubuntu-latest
            artifact: CompleteJournal-linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,ai]" pyinstaller
          # native window on Windows (WebView2) and macOS (WebKit); Linux uses app-mode browser
          if [ "$RUNNER_OS" != "Linux" ]; then pip install pywebview; fi

      - name: Tests
        env:
          PYTHONWARNDEFAULTENCODING: "1"
        run: python -m pytest -q

      - name: Build app
        run: pyinstaller packaging/completejournal.spec --noconfirm

      - name: Smoke test the built app
        run: |
          BIN=dist/CompleteJournal/CompleteJournal
          if [ "$RUNNER_OS" = "Windows" ]; then BIN="$BIN.exe"; fi
          DATA="$RUNNER_TEMP/cjdata"
          # own output file: a background process holding the step's stdout can hang the step
          "$BIN" --no-window --data-dir "$DATA" > "$RUNNER_TEMP/app.out" 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          python - "$DATA" <<'PY'
          import json, re, sys, time, urllib.request, pathlib
          data = pathlib.Path(sys.argv[1])
          url, log = None, data / "desktop.log"
          for _ in range(90):
              if log.exists():
                  found = re.findall(r"http://127\.0\.0\.1:\d+", log.read_text())
                  if found:
                      url = found[-1]
                      break
              time.sleep(1)
          assert url, "app did not report its URL"
          health = json.load(urllib.request.urlopen(url + "/api/health"))
          assert health["ok"], health
          html = urllib.request.urlopen(url + "/").read().decode()
          assert "<title>Complete Journal</title>" in html
          demo = json.load(urllib.request.urlopen(urllib.request.Request(url + "/api/demo", method="POST")))
          assert demo["trades_total"] > 0, demo
          print("smoke test passed:", url, health)
          PY

      - name: Package
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "../${{ matrix.artifact }}.zip" CompleteJournal >/dev/null
          elif [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --keepParent "Complete Journal.app" "../${{ matrix.artifact }}.zip"
          else
            tar czf "../${{ matrix.artifact }}.tar.gz" CompleteJournal
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
